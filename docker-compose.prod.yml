services:
  db:
    image: postgres:16-alpine
    container_name: milven_website_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-milvenweb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-milvenweb}"
        ]
      interval: 10s
      timeout: 5s
      retries: 20


  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: milven_website_web
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-milvenweb}?schema=public

      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}

      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://milven.co.zw}

      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-advisory@milven.co.zw}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}

      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Milven Administrator}

    expose:
      - "3000"

    volumes:
      - uploads:/app/public/uploads


  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: milven_website_backup
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-milvenweb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6

      TZ: Africa/Harare

    volumes:
      - backups:/backups


volumes:
  db_data:
  uploads:
  backups: