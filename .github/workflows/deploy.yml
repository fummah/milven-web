name: Deploy to production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false


jobs:

  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:dummy@localhost:5432/dummy?schema=public
          AUTH_SECRET: github-actions-build-secret
          NEXT_PUBLIC_SITE_URL: https://example.com
          ADMIN_EMAIL: advisory@milven.co.zw
          ADMIN_PASSWORD: temporary-build-password
          ADMIN_NAME: Milven Administrator


  deploy:
    name: Deploy Production
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Verify deployment files
        run: |
          echo "Checking repository..."

          test -f Dockerfile || {
            echo "ERROR: Dockerfile missing"
            exit 1
          }

          test -f docker-compose.prod.yml || {
            echo "ERROR: docker-compose.prod.yml missing"
            exit 1
          }

          test -f package.json || {
            echo "ERROR: package.json missing"
            exit 1
          }

          test -f package-lock.json || {
            echo "ERROR: package-lock.json missing"
            exit 1
          }

          echo "Deployment files verified."


      - name: Prepare server directory
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script_stop: true

          script: |
            set -e

            mkdir -p /opt/milven-website

            echo "Server directory:"
            ls -ld /opt/milven-website

            echo "Checking write access..."
            test -w /opt/milven-website || {
              echo "ERROR: SSH user cannot write to /opt/milven-website"
              echo "Run this manually on the server once:"
              echo "sudo chown -R aaa:aaa /opt/milven-website"
              exit 1
            }

            echo "Server directory ready."


      - name: Upload application
        uses: appleboy/scp-action@v0.1.7

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}

          source: >
            Dockerfile,
            docker-compose.prod.yml,
            package.json,
            package-lock.json,
            next.config.mjs,
            tsconfig.json,
            postcss.config.js,
            tailwind.config.ts,
            app,
            components,
            lib,
            prisma,
            public

          target: /opt/milven-website

          overwrite: true


      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script_stop: true
          command_timeout: 45m

          script: |
            set -e

            cd /opt/milven-website

            echo "======================================"
            echo "MILVEN WEBSITE DEPLOYMENT"
            echo "======================================"

            echo "Checking required files..."

            test -f Dockerfile || {
              echo "ERROR: Dockerfile missing"
              ls -la
              exit 1
            }

            test -f docker-compose.prod.yml || {
              echo "ERROR: docker-compose.prod.yml missing"
              exit 1
            }

            test -f package.json || {
              echo "ERROR: package.json missing"
              exit 1
            }

            test -f .env || {
              echo "ERROR: .env missing"
              exit 1
            }

            echo "Files OK."

            echo "Validating Docker Compose..."
            docker compose -f docker-compose.prod.yml config > /dev/null

            echo "Building application..."
            docker compose -f docker-compose.prod.yml build web

            echo "Starting database..."
            docker compose -f docker-compose.prod.yml up -d db

            echo "Waiting for PostgreSQL..."

            for i in $(seq 1 30); do
              STATUS=$(docker inspect \
                --format='{{.State.Health.Status}}' \
                milven_website_db 2>/dev/null || echo "unknown")

              echo "Database status: $STATUS"

              if [ "$STATUS" = "healthy" ]; then
                echo "Database is healthy."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "ERROR: Database did not become healthy."
                docker compose -f docker-compose.prod.yml logs --tail=100 db
                exit 1
              fi

              sleep 2
            done

            echo "Checking Prisma migration status..."
            docker compose -f docker-compose.prod.yml run --rm web \
              npx prisma migrate status

            echo "Running Prisma migrations..."
            docker compose -f docker-compose.prod.yml run --rm web \
              npx prisma migrate deploy

            echo "Starting website..."
            docker compose -f docker-compose.prod.yml up -d web

            echo "Waiting for application..."
            sleep 15

            echo "Container status:"
            docker compose -f docker-compose.prod.yml ps

            echo "Checking web container..."
            WEB_RUNNING=$(docker inspect \
              -f '{{.State.Running}}' \
              milven_website_web 2>/dev/null || echo false)

            if [ "$WEB_RUNNING" != "true" ]; then
              echo "ERROR: milven_website_web is not running."
              docker compose -f docker-compose.prod.yml logs --tail=100 web
              exit 1
            fi

            echo "Health check..."
            curl --fail \
              --silent \
              --show-error \
              --max-time 30 \
              http://127.0.0.1:3000/ \
              > /dev/null

            echo "Health check passed."

            echo "Cleaning dangling Docker images..."
            docker image prune -f

            echo "======================================"
            echo "DEPLOYMENT COMPLETE"
            echo "======================================"